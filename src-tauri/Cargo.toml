[package]
name = "akira-library"
version = "0.1.0"
description = "A Zotero-style YAML reference manager."
authors = ["Akira"]
edition = "2021"

[lib]
name = "akira_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
